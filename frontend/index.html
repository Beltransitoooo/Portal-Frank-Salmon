<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1d24" />
    <title>Frank Salmón · Portal</title>

    <style>
  html, body { margin: 0; background: #0a1d24; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0a1d24; }
  #boot i { display: block; position: relative; width: 120px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  #boot i::after { content: ''; position: absolute; inset: 0; background: #ea6c00; transform-origin: left; animation: boot 1s ease-in-out infinite; }
  @keyframes boot { from { transform: scaleX(0); } to { transform: scaleX(1); } }
</style>

  </head>
  <body>
    <div id="root"><div id="boot"><i></i></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
